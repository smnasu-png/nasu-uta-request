name: update-songlist

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 JST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest database from arnie-pj/nasu-utamita
        run: curl -fsSL https://raw.githubusercontent.com/arnie-pj/nasu-utamita/main/database -o database

      - name: Fetch titles for new videos (cached ones are skipped)
        run: node scripts/fetch_titles.mjs

      - name: Build site data
        run: node scripts/build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: sync songlist from nasu-utamita database"
          git push
